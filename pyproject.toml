[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transformer-from-scratch"
version = "0.1.0"
description = "An educational PyTorch implementation of the Transformer architecture."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
dependencies = ["torch>=1.9.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
